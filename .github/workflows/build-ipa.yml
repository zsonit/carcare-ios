name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "dist/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (macOS)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, iphoneos)
        run: |
          set -o pipefail
          xcodebuild \
            -project CarCare.xcodeproj \
            -scheme CarCare \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build | tee build.log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/CarCare.app"
          test -d "$APP" || { echo "App bundle not found"; exit 1; }
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          NAME="CheGuanJia-iOS-v${VERSION}-${BUILD}-unsigned"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/CarCare.app/_CodeSignature
          zip -qry "${NAME}.ipa" Payload
          echo "IPA_NAME=${NAME}" >> "$GITHUB_ENV"
          unzip -l "${NAME}.ipa" | head -15
          ls -lh "${NAME}.ipa"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: carcare-ipa-unsigned
          path: "*.ipa"
          if-no-files-found: error

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
