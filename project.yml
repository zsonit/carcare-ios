name: CarCare
options:
  bundleIdPrefix: com.zsonit
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "2.8.4"
    CURRENT_PROJECT_VERSION: "35"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_MODULE_VERIFIER: NO

targets:
  CarCare:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: CarCare
      - path: Resources/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zsonit.carcare
        PRODUCT_NAME: CarCare
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 车管家
        CFBundleName: CarCare
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Light
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryUsageDescription: 用于选择维保收据、发票照片作为凭证，图片仅保存在本机。
        NSCameraUsageDescription: 用于拍摄维保收据、发票作为凭证，图片仅保存在本机。
        NSLocalNetworkUsageDescription: 用于连接你局域网内的 NAS 同步服务，备份与多设备共享维保数据。
        NSMicrophoneUsageDescription: 用于语音记账和与 AI 车况助手按住说话，录音不上传、不保存。
        NSLocationWhenInUseUsageDescription: 用于获取你附近的加油站并展示所在省份油价，位置只在本机使用、不上传。
        NSSpeechRecognitionUsageDescription: 用于把你说的话转成文字，可直接与 AI 助手对话或填入记账表单，识别在本机完成，不会上传语音。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true

schemes:
  CarCare:
    build:
      targets:
        CarCare: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
